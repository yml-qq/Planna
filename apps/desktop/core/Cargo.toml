[package]
name = "planna_desktop_core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Planna desktop local store: SQLite single source of truth plus atomic outbox"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
