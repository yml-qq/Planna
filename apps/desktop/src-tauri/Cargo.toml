[package]
name = "planna_desktop"
version = "0.1.0"
edition = "2024"
description = "Planna desktop shell (Tauri 2)"
license = "Apache-2.0"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
planna_desktop_core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
