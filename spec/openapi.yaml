openapi: 3.1.0
info:
  title: Planna Core API
  version: 0.1.0
  description: |
    ASP.NET Core .NET 10 backend contract for Planna (普拉清单), a modern,
    lightweight, AI-native, offline-first personal task and time management app.
    This is an implementation starting point, not a verified deployed endpoint.
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Tasks
  - name: Lists
  - name: Tags
  - name: Steps
  - name: Sync
  - name: AI
paths:
  /health/live:
    get:
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Service process responding
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: ok}
  /auth/login/challenges:
    post:
      tags: [Identity]
      operationId: createLoginChallenge
      security: []
      description: Queue an encrypted six-digit, ten-minute email code for delivery; a repeated email and idempotency key within 24 hours does not queue or send again. New requests are limited to 3 per email, 5 per device and 20 per source IP within 15 minutes. Delivery is asynchronous and may be retried.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '202':
          description: Challenge and email delivery job committed atomically; delivery is pending.
          content:
            application/json:
              schema:
                type: object
                required: [expires_at]
                properties:
                  expires_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
        '429':
          description: Challenge request rate limited; retry after the indicated number of seconds.
          headers:
            Retry-After:
              description: Seconds until the oldest request in the limiting window expires.
              schema: {type: integer, minimum: 1, maximum: 900}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
  /auth/login:
    post:
      tags: [Identity]
      operationId: login
      security: []
      description: Verify a one-time code. Failed attempts across emails are limited to 10 per device and 40 per source IP within 15 minutes; each challenge also allows at most five wrong codes. A successful login does not consume the failure budget.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, code, device_name, platform]
              properties:
                email: {type: string, format: email}
                code: {type: string, pattern: '^[0-9]{6}$'}
                device_name: {type: string, maxLength: 120}
                platform: {type: string, enum: [android, ios, windows, macos, linux]}
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '429':
          description: Source has too many failed login attempts; retry after the indicated seconds.
          headers:
            Retry-After:
              description: Seconds until the oldest failure in the limiting window expires.
              schema: {type: integer, minimum: 1, maximum: 900}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
  /auth/refresh:
    post:
      tags: [Identity]
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200':
          description: Rotated tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /auth/devices:
    get:
      tags: [Identity]
      operationId: listDevices
      description: List the authenticated owner's active device sessions using stable descending created_at/id keyset pagination. Revoked sessions are omitted.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: cursor
          in: query
          schema: {type: string}
          description: Opaque next_cursor from the preceding page.
      responses:
        '200':
          description: Active device sessions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceSessionPage'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /auth/devices/{id}/revoke:
    post:
      tags: [Identity]
      operationId: revokeDevice
      description: Revoke one owned session. The same idempotency key replays as 204 even after the session is revoked; a different key conflicts. Access and refresh tokens for the session then fail.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceIfMatch'
      responses:
        '204': {description: Revoked or identical replay}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /auth/logout:
    post:
      tags: [Identity]
      operationId: logout
      description: Revoke the current JWT session with the same version and idempotency semantics as device revocation. A replay using the now-invalid JWT returns 401.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceIfMatch'
      responses:
        '204': {description: Current session revoked}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /auth/step-up/challenges:
    post:
      tags: [Identity]
      operationId: createSensitiveActionChallenge
      description: Send a fresh 6-digit account-deletion verification code to the authenticated account email. Codes are stored hashed, expire after 10 minutes and are delivered through a leased retry queue; challenges are rate limited per account (3 per 15 minutes) and the same idempotency key replays the original expiry without resending. The code is never returned by the API.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Challenge queued without exposing the code.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [purpose, expires_at]
                properties:
                  purpose: {type: string, const: account_delete}
                  expires_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
  /auth/step-up:
    post:
      tags: [Identity]
      operationId: verifySensitiveAction
      description: Verify the latest unexpired email code for account deletion. Only the newest challenge is accepted, at most 5 attempts are allowed, a used code is consumed and never accepted twice, and success returns a 10-minute HMAC-signed token bound to this owner and the account_delete purpose for use by deletion requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, code]
              properties:
                purpose: {type: string, const: account_delete}
                code: {type: string, minLength: 6, maxLength: 6}
      responses:
        '200':
          description: Fresh confirmation token for this owner and purpose.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [confirmation_token, expires_at]
                properties:
                  confirmation_token: {type: string, minLength: 16}
                  expires_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema:
                type: object
                required: [id, email, timezone]
                properties:
                  id: {type: string, format: uuid}
                  email: {type: string, format: email}
                  timezone: {type: string, example: Asia/Shanghai}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /me/exports:
    post:
      tags: [Identity]
      operationId: createAccountExport
      description: Creates an export of committed cloud data at a consistent repeatable-read snapshot and returns a ready job (synchronous generation for the MVP; a worker may replace it later behind the same contract). The same idempotency key replays the original job. Complete local export remains a client feature.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Export job accepted (ready or replayed) for the same idempotency key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountExportJob'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
    get:
      tags: [Identity]
      operationId: listAccountExports
      responses:
        '200':
          description: Recent export jobs for the authenticated owner.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AccountExportJob'}}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /me/exports/{id}:
    get:
      tags: [Identity]
      operationId: getAccountExport
      description: Export status for the current owner; foreign exports return 404.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Export status for current owner.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountExportJob'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /me/exports/{id}/download:
    get:
      tags: [Identity]
      operationId: downloadAccountExport
      description: Authorized JSON export for the current owner; available for 24 hours after ready. Expired exports return 410 EXPORT_EXPIRED and non-ready exports return 409 EXPORT_NOT_READY.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Authorized JSON export, available for 24 hours after ready.
          headers:
            Content-Disposition:
              schema: {type: string}
              description: attachment filename; never includes user supplied text.
          content:
            application/json:
              schema: {$ref: './account-export.schema.json'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '410': {$ref: '#/components/responses/ErrorResponse'}
  /me/deletion-requests:
    post:
      tags: [Identity]
      operationId: requestAccountDeletion
      description: Step-up authenticated final confirmation. Requires a fresh account_delete confirmation token from POST /auth/step-up and an explicit acknowledgement of offline devices; on success the account is disabled and every device session is revoked before the response, and the versioned deletion request is recorded for the later cleanup job. The same idempotency key replays the original accepted result; after deletion every retry with an old token returns ACCOUNT_DELETED.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation_token, acknowledge_offline_devices]
              properties:
                confirmation_token: {type: string, minLength: 16}
                acknowledge_offline_devices: {type: boolean, const: true}
      responses:
        '202':
          description: Deletion accepted; sessions revoked before response.
          content:
            application/json:
              schema: {$ref: './account-deletion.schema.json'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /lists:
    get:
      tags: [Lists]
      operationId: listTaskLists
      description: All non-deleted lists of the authenticated owner, including the inbox and archived lists, ordered by sort_order then id.
      responses:
        '200':
          description: Lists for current user
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TaskList'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
    post:
      tags: [Lists]
      operationId: createTaskList
      description: Create a custom list; the server always sets kind=custom because the inbox is only created during registration. Duplicate names are allowed. The same idempotency key replays the original 201.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: {type: string, format: uuid}
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '201':
          description: Created list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskList'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /lists/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Lists]
      operationId: getTaskList
      description: Return one owned, non-deleted list; foreign or soft-deleted lists return 404.
      responses:
        '200':
          description: List
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskList'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    patch:
      tags: [Lists]
      operationId: updateTaskList
      description: Rename an owned non-deleted list (archived lists included) with a version check. A stale expected_version returns 409 with error.details containing entity_id, server_version and changed_fields. The same idempotency key replays the original response.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, patch]
              properties:
                expected_version: {type: integer, minimum: 1}
                patch:
                  type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '200':
          description: Renamed list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskList'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [Lists]
      operationId: deleteTaskList
      description: Soft-delete an owned empty non-deleted list with a strong If-Match version. Lists still containing non-deleted tasks return 409 LIST_NOT_EMPTY and the inbox returns 422 LIST_INBOX_PROTECTED. Writes deleted_at, bumps version and records a sync_changes op=delete tombstone in one transaction; the same idempotency key replays as 204.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: {type: string, pattern: '^"v[0-9]+"$'}
      responses:
        '204': {description: Soft-deleted list or identical replay}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /tags:
    get:
      tags: [Tags]
      operationId: listTags
      description: All non-deleted tags of the authenticated owner ordered by name then id.
      responses:
        '200':
          description: Tags for current user
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Tag'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
    post:
      tags: [Tags]
      operationId: createTag
      description: Create a tag. Names are unique per owner case-insensitively among non-deleted tags; recreating a name after soft delete is allowed. The same idempotency key replays the original 201.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: {type: string, format: uuid}
                name: {type: string, minLength: 1, maxLength: 60}
                color: {type: [string, 'null'], maxLength: 32}
      responses:
        '201':
          description: Created tag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tag'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /tags/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Tags]
      operationId: getTag
      description: Return one owned, non-deleted tag; foreign or soft-deleted tags return 404.
      responses:
        '200':
          description: Tag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tag'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    patch:
      tags: [Tags]
      operationId: updateTag
      description: Rename or recolor an owned non-deleted tag with a version check; omitted fields keep their values and null clears color. A stale expected_version returns 409 with error.details containing entity_id, server_version and changed_fields. Name conflicts return 409 TAG_NAME_CONFLICT.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, patch]
              properties:
                expected_version: {type: integer, minimum: 1}
                patch:
                  type: object
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    name: {type: string, minLength: 1, maxLength: 60}
                    color: {type: [string, 'null'], maxLength: 32}
      responses:
        '200':
          description: Updated tag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tag'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [Tags]
      operationId: deleteTag
      description: Soft-delete an owned tag with a strong If-Match version; task-tag associations are left for clients to reconcile. Writes deleted_at, bumps version and records a sync_changes op=delete tombstone in one transaction; the same idempotency key replays as 204.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: {type: string, pattern: '^"v[0-9]+"$'}
      responses:
        '204': {description: Soft-deleted tag or identical replay}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /habits:
    get:
      tags: [Habits]
      operationId: listHabits
      description: Non-deleted habits of the authenticated owner, newest first. Habits are a separate aggregate from tasks.
      responses:
        '200':
          description: Owned habits
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Habit'}}
        '401': {$ref: '#/components/responses/ErrorResponse'}
    post:
      tags: [Habits]
      operationId: createHabit
      description: Create a habit with a schedule (daily/weekly/weekdays), target quantity and time zone. The same idempotency key replays the original habit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, schedule_type, time_zone]
              properties:
                title: {type: string, minLength: 1, maxLength: 200}
                schedule_type: {type: string, enum: [daily, weekly, weekdays]}
                weekdays:
                  type: array
                  minItems: 1
                  maxItems: 7
                  uniqueItems: true
                  items: {type: integer, minimum: 1, maximum: 7}
                target_quantity: {type: integer, minimum: 1, maximum: 1000, default: 1}
                unit: {type: string, minLength: 1, maxLength: 20, default: count}
                time_zone: {type: string, minLength: 1, maxLength: 128}
      responses:
        '201':
          description: Created habit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Habit'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /habits/{id}:
    get:
      tags: [Habits]
      operationId: getHabit
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Owned habit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Habit'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    patch:
      tags: [Habits]
      operationId: updateHabit
      description: Version-checked partial update. Switching schedule_type away from weekly clears weekdays; weekly requires 1..7 unique weekdays. paused toggles paused_at.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, patch]
              properties:
                expected_version: {type: integer, minimum: 1}
                patch: {$ref: '#/components/schemas/HabitPatch'}
      responses:
        '200':
          description: Updated habit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Habit'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [Habits]
      operationId: deleteHabit
      description: Soft delete with the session version from If-Match; the same idempotency key replays 204.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: {type: string, pattern: '^"v[0-9]+"$'}
      responses:
        '204': {description: Deleted or identical replay}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /habits/{id}/logs:
    get:
      tags: [Habits]
      operationId: listHabitLogs
      description: Logs of one owned habit inside an inclusive local-date window (at most 366 days). Logs are keyed by (habit, local date).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Logs ordered by date
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/HabitLog'}}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /habits/{id}/logs/{date}:
    put:
      tags: [Habits]
      operationId: upsertHabitLog
      description: Idempotent upsert of the single log for a local date (same-date uniqueness); explicit past dates are user-initiated backfill. quantity defaults to 1 and status to done; an existing log is updated in place with a version bump.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: date, in: path, required: true, schema: {type: string, format: date}}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                quantity: {type: integer, minimum: 0, maximum: 1000, default: 1}
                status: {type: string, enum: [done, skipped], default: done}
      responses:
        '200':
          description: Stored daily log
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HabitLog'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      description: List the authenticated owner's non-deleted tasks using stable descending created_at/id keyset pagination. Soft-deleted tasks are omitted. The optional list_id filter must reference an owned, non-deleted list; the optional status filter accepts todo/in_progress/done/archived; the optional tag_id filter must reference an owned, non-deleted tag and keeps only tasks carrying that tag. The cursor is opaque and must be passed back unchanged.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: cursor
          in: query
          schema: {type: string}
          description: Opaque next_cursor from the preceding page.
        - name: list_id
          in: query
          schema: {type: string, format: uuid}
        - name: status
          in: query
          schema: {type: string, enum: [todo, in_progress, done, archived]}
        - name: tag_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Paged tasks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPage'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    post:
      tags: [Tasks]
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTask'}
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      description: Return the full projection of one owned, non-deleted task including completed_at and version. Foreign or soft-deleted tasks return 404.
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    patch:
      tags: [Tasks]
      operationId: updateTask
      description: Versioned partial update. The patch accepts only title/description/priority/due_at/due_local_date/time_zone/estimate_minutes; omitted fields keep their values and null clears a nullable field. A stale expected_version returns 409 with error.details containing entity_id, server_version and changed_fields. The same idempotency key replays the original response.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTask'}
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [Tasks]
      operationId: deleteTask
      description: Soft-delete an owned task with a strong If-Match version. Writes deleted_at, bumps version and records a sync_changes op=delete tombstone in one transaction; the same idempotency key replays as 204.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: {type: string, pattern: '^"v[0-9]+"$'}
      responses:
        '204': {description: Soft-deleted task or identical replay}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /tasks/{id}/complete:
    post:
      tags: [Tasks]
      operationId: completeTask
      description: Complete a non-recurring task from todo/in_progress to done with a server-trusted completed_at (missing uses server time, values outside created_at..now are clamped). Already completed returns 409 ALREADY_COMPLETED, archived returns 422, recurring tasks require occurrence semantics and return 422 until TIME-01. The same idempotency key replays the original response.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version]
              properties:
                expected_version: {type: integer, minimum: 1}
                occurrence_id: {type: [string, 'null'], format: uuid}
                completed_at: {type: [string, 'null'], format: date-time}
      responses:
        '200':
          description: Completion result; an ordinary task returns the Task projection, while a recurring task with occurrence_id returns the completed Occurrence.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Task'
                  - $ref: '#/components/schemas/Occurrence'
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /tasks/{id}/reopen:
    post:
      tags: [Tasks]
      operationId: reopenTask
      description: Reopen a completed non-recurring task back to todo and clear completed_at with a version check; for RRULE tasks the request must name occurrence_id and reopens that completed occurrence instead (the task row is unchanged). Not-completed targets return 409 NOT_COMPLETED, archived tasks return 422. The same idempotency key replays the original response.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version]
              properties:
                expected_version: {type: integer, minimum: 1}
                occurrence_id: {type: [string, 'null'], format: uuid}
      responses:
        '200':
          description: Reopened task, or the reopened occurrence when occurrence_id targets a recurring instance.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Task'
                  - $ref: '#/components/schemas/Occurrence'
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /tasks/{id}/tags:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tags]
      operationId: listTaskTags
      description: Return the owned non-deleted tags currently attached to an owned, non-deleted task; foreign or soft-deleted tasks return 404.
      responses:
        '200':
          description: Tags of the task
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Tag'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    put:
      tags: [Tags]
      operationId: replaceTaskTags
      description: Replace the complete tag set of an owned task with a version check. Tag IDs must belong to the owner and be non-deleted; at most 20 unique IDs; an empty array clears all tags. Bumps the task version and records a task sync change with tag_ids. The same idempotency key replays the original response.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, tag_ids]
              properties:
                expected_version: {type: integer, minimum: 1}
                tag_ids:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: {type: string, format: uuid}
      responses:
        '200':
          description: Replaced tag set
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskTagSet'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /tasks/{id}/steps:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Steps]
      operationId: listSteps
      description: List the non-deleted steps of an owned, non-deleted task ordered by position then id; foreign or soft-deleted tasks return 404.
      responses:
        '200':
          description: Steps of the task
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TaskStep'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    post:
      tags: [Steps]
      operationId: createStep
      description: Create a step under an owned, non-deleted task. Title is trimmed to 1..500 characters, position is non-negative (default 0), estimate_minutes is optional 1..1440. The same idempotency key replays the original 201.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, title]
              properties:
                id: {type: string, format: uuid}
                title: {type: string, minLength: 1, maxLength: 500}
                position: {type: number, minimum: 0}
                estimate_minutes: {type: [integer, 'null'], minimum: 1, maximum: 1440}
      responses:
        '201':
          description: Created step
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskStep'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /steps/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [Steps]
      operationId: updateStep
      description: Versioned partial update of an owned, non-deleted step. Omitted fields keep their values and null clears estimate_minutes; a stale expected_version returns 409 with error.details containing entity_id, server_version and changed_fields. The same idempotency key replays the original response.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, patch]
              properties:
                expected_version: {type: integer, minimum: 1}
                patch:
                  type: object
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    title: {type: string, minLength: 1, maxLength: 500}
                    is_done: {type: boolean}
                    position: {type: number, minimum: 0}
                    estimate_minutes: {type: [integer, 'null'], minimum: 1, maximum: 1440}
      responses:
        '200':
          description: Updated step
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskStep'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [Steps]
      operationId: deleteStep
      description: Soft-delete an owned step with a strong If-Match version. Writes deleted_at, bumps version and records a sync_changes op=delete tombstone in one transaction; the same idempotency key replays as 204.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: {type: string, pattern: '^"v[0-9]+"$'}
      responses:
        '204': {description: Soft-deleted step or identical replay}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /tasks/{id}/recurrence:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getRecurrence
      description: Return the recurrence rule of an owned, non-deleted task; 404 when the task or rule does not exist.
      responses:
        '200':
          description: Recurrence rule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Recurrence'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    put:
      tags: [Tasks]
      operationId: putRecurrence
      description: Create (expected_version 0) or replace the recurrence of an owned task. kind=rrule supports FREQ=DAILY|WEEKLY|MONTHLY with INTERVAL, COUNT/UNTIL and WEEKLY BYDAY; kind=after_completion requires interval_days 1..3650 and generates the next occurrence N days after completion. Mixing rrule and interval_days is rejected with 422, as are unsupported parts. dtstart_local is a local timestamp in the given IANA time zone.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, kind, time_zone, dtstart_local]
              properties:
                expected_version: {type: integer, minimum: 0}
                kind: {type: string, enum: [rrule, after_completion]}
                rrule: {type: [string, 'null'], minLength: 1, maxLength: 1000}
                interval_days: {type: [integer, 'null'], minimum: 1, maximum: 3650}
                time_zone: {type: string}
                dtstart_local: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?$'}
      responses:
        '200':
          description: Saved recurrence rule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Recurrence'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [Tasks]
      operationId: deleteRecurrence
      description: Remove the recurrence rule of an owned task with a strong If-Match version; occurrence rows are retained as history. The same idempotency key replays as 204.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: {type: string, pattern: '^"v[0-9]+"$'}
      responses:
        '204': {description: Removed recurrence rule or identical replay}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /tasks/{id}/occurrences:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: listOccurrences
      description: Materialize and list occurrences of the task recurrence inside a local date window (max 90 days, defaults to the next 30 days). Materialization is idempotent; nonexistent DST local times are skipped and ambiguous times produce one occurrence at the earliest instant. Occurrence rows are derived state and do not bump the owner revision.
      parameters:
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
      responses:
        '200':
          description: Occurrences in the window
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Occurrence'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /sync/push:
    post:
      tags: [Sync]
      operationId: pushMutations
      description: Apply offline mutations one by one; each mutation commits atomically on its own and the batch is not all-or-nothing. Results report accepted/duplicate/conflict/rejected with entity_version and server_entity; accepted and duplicate mutations may be removed from the client outbox. Duplicates are keyed by mutation_id. Conflicts carry the current server version and entity for rebasing. This slice supports task upsert/delete; other entity types are rejected without retry.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SyncPushRequest'}
      responses:
        '200':
          description: Per-mutation results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncPushResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /sync/pull:
    get:
      tags: [Sync]
      operationId: pullChanges
      description: Incremental changes for the authenticated owner ordered by committed revision and change_index. The cursor is opaque, returned as next_cursor and passed back unchanged; changes are never addressed by updated_at. When the requested revision predates the retained window the server returns 410 CURSOR_EXPIRED and the client must bootstrap safely.
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
          description: Opaque next_cursor from the preceding pull; omit for the beginning of the retained window.
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Incremental change pages for current owner
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncPullResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '410': {$ref: '#/components/responses/ErrorResponse'}
  /sync/bootstrap:
    post:
      tags: [Sync]
      operationId: bootstrapSync
      description: Read one consistent snapshot of non-deleted tasks and lists together with the committed revision, under a repeatable-read transaction. snapshot_cursor is opaque and can be passed to /sync/pull to continue incremental sync; changes committed after the snapshot are returned by that pull. next_page_token is reserved and currently always null.
      responses:
        '200':
          description: Single-page snapshot bound to the committed revision
          content:
            application/json:
              schema:
                type: object
                required: [snapshot_cursor, tasks, lists]
                properties:
                  snapshot_cursor: {type: string}
                  next_page_token: {type: [string, 'null']}
                  tasks: {type: array, items: {$ref: '#/components/schemas/Task'}}
                  lists: {type: array, items: {$ref: '#/components/schemas/TaskList'}}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /ai/consent:
    get:
      tags: [AI]
      operationId: getAiConsent
      description: Long-term AI data consent scopes for the authenticated owner. An empty list means AI data access is revoked; consent is stored server-side and included in account exports.
      responses:
        '200':
          description: Current consent; empty when never granted or revoked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiConsent'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
    put:
      tags: [AI]
      operationId: updateAiConsent
      description: Replace the long-term AI data consent scope set; an empty array revokes all long-term AI data access. Only whitelisted scopes are accepted and duplicates are rejected. The same idempotency key replays the original view. Consent is not synced task data and never advances the sync revision.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [allowed_scopes]
              properties:
                allowed_scopes:
                  type: array
                  uniqueItems: true
                  maxItems: 4
                  items: {$ref: '#/components/schemas/AiConsentScope'}
      responses:
        '200':
          description: Stored consent view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiConsent'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
  /ai/parse:
    post:
      tags: [AI]
      operationId: parseNaturalLanguage
      description: Parse one natural-language input into a draft for user confirmation; drafts never mutate data and are not executed automatically. The first stage is a deterministic rule-based parser (docs/09 先规则解析) with an injectable provider abstraction; when no provider is configured the endpoint returns 503 AI_UNAVAILABLE. Prompt-injection text is treated as task text only.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiParseRequest'}
      responses:
        '200':
          description: Draft parse, no business mutation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiParseResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /ai/tasks/{id}/breakdowns:
    post:
      tags: [AI]
      operationId: proposeTaskBreakdown
      description: Persist a draft of at most 20 steps for an owned task; no business steps are created until apply. The first stage uses a deterministic rule-based splitter (docs/09) behind an injectable provider; the task version must match expected_version. The same idempotency key replays the original draft.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version]
              properties:
                expected_version: {type: integer, minimum: 1}
                guidance: {type: string, maxLength: 2000}
      responses:
        '201':
          description: Persisted editable draft, at most 20 steps.
          content:
            application/json:
              schema: {$ref: './ai-breakdown.schema.json'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /ai/breakdowns/{id}:
    put:
      tags: [AI]
      operationId: editTaskBreakdown
      description: Replace all draft steps with the current snapshot_hash; revalidate title/count/positions/estimates and issue a fresh snapshot hash and confirmation token (the previous token is invalidated). Applied or expired drafts return 409 BREAKDOWN_STALE.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [snapshot_hash, steps]
              properties:
                snapshot_hash: {type: string, minLength: 16}
                steps: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/BreakdownStep'}}
      responses:
        '200':
          description: Revalidated persisted draft.
          content:
            application/json:
              schema: {$ref: './ai-breakdown.schema.json'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /ai/breakdowns/{id}/apply:
    post:
      tags: [AI]
      operationId: applyTaskBreakdown
      description: Apply the complete confirmed draft atomically; no partial step writes. Validates owner, draft status/expiry, snapshot hash, confirmation token and current task version; creates all steps in one transaction, advances the owner revision and records sync changes plus an audit row. The same idempotency key returns the same applied result.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [snapshot_hash, confirmation_token]
              properties:
                snapshot_hash: {type: string, minLength: 16}
                confirmation_token: {type: string, minLength: 16}
      responses:
        '200':
          description: Applied result; same idempotency key returns same result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, task_id, step_ids]
                properties:
                  status: {type: string, const: applied}
                  task_id: {type: string, format: uuid}
                  step_ids: {type: array, minItems: 1, maxItems: 20, items: {type: string, format: uuid}}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
  /ai/plans:
    post:
      tags: [AI]
      operationId: proposeAiPlan
      description: Build a deterministic plan preview (sequential time blocks inside the range) without mutating data. Tasks that are not owned, not found or exceed 20 operations land in unplanned_task_ids; overlaps with existing time blocks land in conflicts. The plan expires after 30 minutes and apply requires exact operation equality.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [task_ids, range_start, range_end]
              properties:
                task_ids: {type: array, items: {type: string, format: uuid}, minItems: 1, maxItems: 100, uniqueItems: true}
                range_start: {type: string, format: date-time}
                range_end: {type: string, format: date-time}
      responses:
        '200':
          description: Validated preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiPlan'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
  /ai/plans/{id}/apply:
    post:
      tags: [AI]
      operationId: applyAiPlan
      description: Apply the complete persisted plan atomically. V1.0 requires accepted_operation_ids to equal all persisted operation IDs exactly; the snapshot hash, confirmation token, plan expiry and every task expected_version are validated before any time block is written. Failures return 409 PLAN_STALE without partial writes; the same idempotency key returns the same applied operation IDs.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [snapshot_hash, accepted_operation_ids, confirmation_token]
              properties:
                snapshot_hash: {type: string}
                accepted_operation_ids: {type: array, items: {type: string, format: uuid}, minItems: 1, maxItems: 20, uniqueItems: true, description: 'V1.0 requires exact equality with all persisted plan operation IDs.'}
                confirmation_token: {type: string}
      responses:
        '200':
          description: Applied operation IDs and server versions
          content:
            application/json:
              schema:
                type: object
                required: [status, applied_operation_ids]
                properties:
                  status: {type: string, const: applied}
                  applied_operation_ids: {type: array, items: {type: string, format: uuid}}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: Stable key reused for retries of the same write.
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: Stable, non-empty client installation ID; it is an abuse signal, not proof of identity.
    DeviceIfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$', example: '"1"'}
      description: Strong quoted version from the device list; stale versions return 409.
    TaskId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    ErrorResponse:
      description: Standard error body
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
  schemas:
    BreakdownStep:
      type: object
      additionalProperties: false
      required: [step_id, title, estimate_minutes, position]
      properties:
        step_id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 500}
        estimate_minutes: {type: [integer, 'null'], minimum: 1, maximum: 1440}
        position: {type: integer, minimum: 0, maximum: 19}
    AccountExportJob:
      type: object
      additionalProperties: false
      required: [export_id, status, requested_at, snapshot_at, expires_at]
      properties:
        export_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, ready, failed, expired]}
        requested_at: {type: string, format: date-time}
        snapshot_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        error_code: {type: [string, 'null']}
    ErrorBody:
      type: object
      required: [error, request_id]
      properties:
        request_id: {type: string}
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            details: {type: object, additionalProperties: true}
    AuthResponse:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        expires_in: {type: integer}
    DeviceSession:
      type: object
      additionalProperties: false
      required: [id, device_name, platform, version, created_at, is_current]
      properties:
        id: {type: string, format: uuid}
        device_name: {type: string}
        platform: {type: string, enum: [android, ios, windows, macos, linux]}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        is_current: {type: boolean}
    DeviceSessionPage:
      type: object
      additionalProperties: false
      required: [devices, next_cursor]
      properties:
        devices: {type: array, items: {$ref: '#/components/schemas/DeviceSession'}}
        next_cursor: {type: [string, 'null']}
    TaskList:
      type: object
      required: [id, name, kind, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [inbox, custom]}
        version: {type: integer, minimum: 1}
    Tag:
      type: object
      additionalProperties: false
      required: [id, name, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 60}
        color: {type: [string, 'null'], maxLength: 32}
        version: {type: integer, minimum: 1}
    Task:
      type: object
      required: [id, list_id, title, status, priority, all_day, time_zone, version]
      properties:
        id: {type: string, format: uuid}
        list_id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        status: {type: string, enum: [todo, in_progress, done, archived]}
        priority: {type: integer, minimum: 0, maximum: 3}
        start_at: {type: [string, 'null'], format: date-time}
        due_at: {type: [string, 'null'], format: date-time}
        due_local_date: {type: [string, 'null'], format: date}
        all_day: {type: boolean}
        time_zone: {type: string}
        estimate_minutes: {type: [integer, 'null'], minimum: 1, maximum: 1440}
        completed_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
        deleted_at: {type: [string, 'null'], format: date-time}
    TaskPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Task'}}
        next_cursor: {type: [string, 'null'], description: Null when no further pages exist.}
    TaskTagSet:
      type: object
      additionalProperties: false
      required: [task_id, version, tag_ids]
      properties:
        task_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        tag_ids:
          type: array
          uniqueItems: true
          maxItems: 20
          items: {type: string, format: uuid}
    TaskStep:
      type: object
      additionalProperties: false
      required: [id, title, is_done, position, version]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 500}
        is_done: {type: boolean}
        position: {type: number, minimum: 0}
        estimate_minutes: {type: [integer, 'null'], minimum: 1, maximum: 1440}
        version: {type: integer, minimum: 1}
    Recurrence:
      type: object
      additionalProperties: false
      required: [task_id, kind, time_zone, dtstart_local, version]
      properties:
        task_id: {type: string, format: uuid}
        kind: {type: string, enum: [rrule, after_completion]}
        rrule: {type: [string, 'null']}
        interval_days: {type: [integer, 'null'], minimum: 1, maximum: 3650}
        time_zone: {type: string}
        dtstart_local: {type: string}
        version: {type: integer, minimum: 1}
    Occurrence:
      type: object
      additionalProperties: false
      required: [id, task_id, original_local_start, time_zone, status, version]
      properties:
        id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        original_local_start: {type: string}
        time_zone: {type: string}
        due_at: {type: [string, 'null'], format: date-time}
        status: {type: string, enum: [todo, done, skipped]}
        completed_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
    CreateTask:
      type: object
      additionalProperties: false
      required: [id, list_id, title]
      properties:
        id: {type: string, format: uuid}
        list_id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 500}
        description: {type: string, maxLength: 20000}
        priority: {type: integer, minimum: 0, maximum: 3, default: 0}
        start_at: {type: [string, 'null'], format: date-time}
        due_at: {type: [string, 'null'], format: date-time}
        due_local_date: {type: [string, 'null'], format: date}
        all_day: {type: boolean, default: false}
        time_zone: {type: string, default: Asia/Shanghai}
        estimate_minutes: {type: [integer, 'null'], minimum: 1, maximum: 1440}
    UpdateTask:
      type: object
      additionalProperties: false
      required: [expected_version, patch]
      properties:
        expected_version: {type: integer, minimum: 1}
        patch:
          type: object
          minProperties: 1
          additionalProperties: false
          properties:
            title: {type: string, minLength: 1, maxLength: 500}
            description: {type: string, maxLength: 20000}
            priority: {type: integer, minimum: 0, maximum: 3}
            due_at: {type: [string, 'null'], format: date-time}
            due_local_date: {type: [string, 'null'], format: date}
            time_zone: {type: string}
            estimate_minutes: {type: [integer, 'null'], minimum: 1, maximum: 1440}
    SyncMutation:
      type: object
      required: [mutation_id, entity_type, entity_id, op, base_version, payload]
      properties:
        mutation_id: {type: string, format: uuid}
        entity_type: {type: string, enum: [task, list, tag, step, reminder, time_block]}
        entity_id: {type: string, format: uuid}
        op: {type: string, enum: [upsert, delete]}
        base_version: {type: integer, minimum: 0}
        payload: {type: object, additionalProperties: true}
    SyncPushRequest:
      type: object
      required: [device_id, mutations]
      properties:
        device_id: {type: string, format: uuid}
        mutations: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/SyncMutation'}}
    SyncPushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [mutation_id, status]
            properties:
              mutation_id: {type: string, format: uuid}
              status: {type: string, enum: [accepted, duplicate, conflict, rejected]}
              entity_version: {type: [integer, 'null']}
              server_entity: {type: [object, 'null'], additionalProperties: true}
              retryable: {type: boolean}
    SyncChange:
      type: object
      required: [revision, change_index, entity_type, entity_id, op, version]
      properties:
        revision: {type: integer, minimum: 1}
        change_index: {type: integer, minimum: 0}
        entity_type: {type: string}
        entity_id: {type: string, format: uuid}
        op: {type: string, enum: [upsert, delete]}
        version: {type: integer, minimum: 1}
        payload: {type: [object, 'null'], additionalProperties: true}
    SyncPullResponse:
      type: object
      required: [changes, next_cursor, has_more, server_time]
      properties:
        changes: {type: array, items: {$ref: '#/components/schemas/SyncChange'}}
        next_cursor: {type: string}
        has_more: {type: boolean}
        server_time: {type: string, format: date-time}
    AiParseRequest:
      type: object
      required: [input, context]
      properties:
        input: {type: string, minLength: 1, maxLength: 10000}
        context:
          type: object
          required: [time_zone, now]
          properties:
            time_zone: {type: string}
            now: {type: string, format: date-time}
        allowed_scopes: {type: array, items: {type: string}}
    AiParseResponse:
      type: object
      required: [intent, drafts, assumptions, unresolved_fields]
      properties:
        intent: {type: string, enum: [create_task, multi_task, clarify, unsupported]}
        drafts:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: {type: string}
              due_at: {type: [string, 'null'], format: date-time}
              time_zone: {type: string}
              reminders: {type: array, items: {type: object, additionalProperties: true}}
        assumptions: {type: array, items: {type: string}}
        unresolved_fields: {type: array, items: {type: string}}
    Habit:
      type: object
      additionalProperties: false
      required: [id, title, schedule_type, target_quantity, unit, time_zone, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 200}
        schedule_type: {type: string, enum: [daily, weekly, weekdays]}
        weekdays: {type: [array, 'null'], items: {type: integer, minimum: 1, maximum: 7}}
        target_quantity: {type: integer, minimum: 1, maximum: 1000}
        unit: {type: string, minLength: 1, maxLength: 20}
        time_zone: {type: string, minLength: 1, maxLength: 128}
        paused_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    HabitLog:
      type: object
      additionalProperties: false
      required: [id, habit_id, log_date, quantity, status, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        habit_id: {type: string, format: uuid}
        log_date: {type: string, format: date}
        quantity: {type: integer, minimum: 0, maximum: 1000}
        status: {type: string, enum: [done, skipped]}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    HabitPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        schedule_type: {type: string, enum: [daily, weekly, weekdays]}
        weekdays: {type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 7}}
        target_quantity: {type: integer, minimum: 1, maximum: 1000}
        unit: {type: string, minLength: 1, maxLength: 20}
        time_zone: {type: string, minLength: 1, maxLength: 128}
        paused: {type: boolean}
    AiConsentScope:
      type: string
      enum: [task_drafts, plan_preview, task_notes, calendar_free_slots]
    AiConsent:
      type: object
      additionalProperties: false
      required: [allowed_scopes, updated_at]
      properties:
        allowed_scopes:
          type: array
          maxItems: 4
          uniqueItems: true
          items: {$ref: '#/components/schemas/AiConsentScope'}
        updated_at: {type: [string, 'null'], format: date-time}
    AiPlan:
      type: object
      required: [plan_id, expires_at, snapshot_hash, confirmation_token, operations, conflicts, unplanned_task_ids, explanation]
      properties:
        plan_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        snapshot_hash: {type: string}
        confirmation_token: {type: string, minLength: 16}
        operations:
          type: array
          maxItems: 20
          items:
            type: object
            required: [operation_id, task_id, expected_version, kind, before, after, reason]
            properties:
              operation_id: {type: string, format: uuid}
              task_id: {type: string, format: uuid}
              expected_version: {type: integer, minimum: 1}
              kind: {type: string, const: set_time_block}
              before: {type: [object, 'null'], additionalProperties: true}
              after:
                type: object
                required: [start_at, end_at]
                properties:
                  start_at: {type: string, format: date-time}
                  end_at: {type: string, format: date-time}
              reason: {type: string}
        conflicts: {type: array, items: {type: string}}
        unplanned_task_ids: {type: array, items: {type: string, format: uuid}}
        explanation: {type: string}
