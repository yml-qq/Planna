name: Server integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres-smoke:
    name: PostgreSQL 18
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: planna
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: planna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planna -d planna_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PLANNADB_CONNECTION: Host=127.0.0.1;Port=5432;Database=planna_test;Username=planna;Password=local-ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore and build
        run: |
          dotnet restore server/Planna.slnx
          dotnet build server/Planna.slnx --no-restore --warnaserror
      - name: Format
        run: dotnet format server/Planna.slnx --verify-no-changes --no-restore
      - name: OpenAPI and shared contract checks
        run: |
          python3 -m venv /tmp/planna-contract-venv
          /tmp/planna-contract-venv/bin/pip install -r tests/contract/requirements.txt
          /tmp/planna-contract-venv/bin/python -m unittest discover -s tests/contract -p 'test_*.py'
          /tmp/planna-contract-venv/bin/python -m openapi_spec_validator spec/openapi.yaml
      - name: PostgreSQL migration and HTTP checks
        run: dotnet run --project server/tests/Planna.MigrationSmoke --no-build
